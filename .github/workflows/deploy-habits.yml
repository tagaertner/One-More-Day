name: Deploy Habits Lambda

on:
  push:
    branches: [dev]
    paths:
      - "lambdas/habits/**/*.py"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r lambdas/habits/requirements.txt

      - name: Run tests
        run: pytest lambdas/habits/tests/

      - name: Zip and deploy
        run: |
          cd lambdas/habits
          zip -r function.zip .
          aws lambda update-function-code \
            --function-name one-more-day-habits \
            --zip-file fileb://function.zip
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: us-east-1

      - name: Run integration tests
        run: |
          pip install pytest requests boto3
          pytest tests/test_habits_integration.py -v -m integration
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: us-east-1
          COGNITO_CLIENT_ID: ${{ secrets.COGNITO_CLIENT_ID }}
          SMOKE_TEST_EMAIL: ${{ secrets.SMOKE_TEST_EMAIL }}
          SMOKE_TEST_PASSWORD: ${{ secrets.SMOKE_TEST_PASSWORD }}
