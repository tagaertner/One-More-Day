name: Deploy Habits Lambda

on:
  push:
    branches: [dev]
    paths:
      - "lambdas/habits/**/*.py"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r lambdas/habits/requirements.txt

      - name: Run tests
        run: pytest lambdas/habits/tests/

      - name: Zip and deploy
        run: |
          cd lambdas/habits
          zip -r function.zip .
          aws lambda update-function-code \
            --function-name habit-tracker-habits-create \
            --zip-file fileb://function.zip
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: us-east-1
