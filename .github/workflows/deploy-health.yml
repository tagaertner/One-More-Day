name: Deploy Health Lambda

on:
  push:
    branches: [dev]
    paths:
      - "lambdas/health/**/*.py"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r lambdas/health/requirements.txt

      - name: Run tests
        run: pytest lambdas/health/tests/

      - name: Zip and deploy
        run: |
          cd lambdas/health
          zip -r function.zip .
          aws lambda update-function-code \
            --function-name one-more-day-health \
            --zip-file fileb://function.zip
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: us-east-1
