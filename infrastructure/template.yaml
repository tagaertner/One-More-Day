AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: One More Day — Serverless backend infrastructure

Resources:
  # ─────────────────────────────────────────
  # SHARED INFRASTRUCTURE — Tami owns this
  # ─────────────────────────────────────────

  # ─── DynamoDB Table ───
  # Shared by all four Lambdas
  # PK: userId, SK: HABIT#id or CHECKIN#habitId#date or USER#profile
  HabitsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: one-more-day-habits
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: userId
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
      KeySchema:
        - AttributeName: userId
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE

  # ─── API Gateway ───
  # Routes all four services through one endpoint
  # Base URL: https://xxxxxxxxxx.execute-api.us-east-1.amazonaws.com/prod
  # API key required for all endpoints — included in x-api-key header
  ApiGateway:
    Type: AWS::Serverless::Api
    Properties:
      Name: one-more-day-api
      StageName: prod
      Auth:
        ApiKeyRequired: true
        UsagePlan:
          CreateUsagePlan: PER_API
          UsagePlanName: one-more-day-usage-plan
          Quota:
            Limit: 10000
            Period: MONTH
          Throttle:
            BurstLimit: 100
            RateLimit: 50
      Cors:
        AllowMethods: "'GET,POST,DELETE,OPTIONS'"
        AllowHeaders: "'Content-Type,X-Amz-Date,Authorization,X-Api-Key'"
        AllowOrigin: "'*'"

  ApiGateway4xxAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: one-more-day-api-4xx-errors
      MetricName: 4XXError
      Namespace: AWS/ApiGateway
      Dimensions:
        - Name: ApiName
          Value: one-more-day-api
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 10
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

  ApiGateway5xxAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: one-more-day-api-5xx-errors
      MetricName: 5XXError
      Namespace: AWS/ApiGateway
      Dimensions:
        - Name: ApiName
          Value: one-more-day-api
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      # Zero tolerance — even one 5xx is urgent
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

  # ─── S3 Buckets ───
  # ReportsBucket — Nilu's Lambda writes weekly report JSON here (MVP)
  # LogsBucket — habit completion logs for Athena queries (Nilu stretch goal)
  ReportsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: one-more-day-reports
      LifecycleConfiguration:
        Rules:
          - Id: DeleteOldReports
            Status: Enabled
            ExpirationInDays: 30

  LogsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: one-more-day-habit-logs
      LifecycleConfiguration:
        Rules:
          - Id: DeleteOldLogs
            Status: Enabled
            ExpirationInDays: 30

  # ─── SNS Topic ───
  # Melody's Lambda publishes here on every successful check-in (MVP)
  CheckinTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: one-more-day-checkin-notifications

  # ─── SES Email Identity ───
  # Aksana stretch goal — daily reminders and weekly summary emails
  # After deploy: go to SES console and verify this email address
  # Change this to whatever email address you want to send from
  SESEmailIdentity:
    Type: AWS::SES::EmailIdentity
    Properties:
      EmailIdentity: one-more-day-notifications@gmail.com

  # ─── EventBridge Rule ───
  # Aksana stretch goal — fires daily at 9am UTC to trigger habit reminders
  # Set to DISABLED so it does not fire during MVP development
  # Aksana enables it in the AWS console when she is ready to test
  DailyReminderRule:
    Type: AWS::Events::Rule
    Properties:
      Name: one-more-day-daily-reminder
      Description: Fires daily at 9am UTC to trigger habit reminders
      ScheduleExpression: "cron(0 9 * * ? *)"
      State: DISABLED
      Targets:
        - Arn: !GetAtt HabitsFunction.Arn
          Id: HabitsFunctionTarget

  # Permission for EventBridge to invoke Aksana's Habits Lambda
  DailyReminderPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref HabitsFunction
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt DailyReminderRule.Arn

  # ─── Athena Workgroup ───
  # Nilu stretch goal — runs pattern queries against S3 habit logs
  # No Glue required — schema defined directly in Athena via DDL
  # Cost: $5 per TB scanned — essentially free at capstone scale
  AthenaWorkgroup:
    Type: AWS::Athena::WorkGroup
    Properties:
      Name: one-more-day-workgroup
      State: ENABLED
      WorkGroupConfiguration:
        ResultConfiguration:
          OutputLocation: !Sub "s3://${LogsBucket}/athena-results/"
        EnforceWorkGroupConfiguration: false

  # ─────────────────────────────────────────
  # LAMBDA FUNCTIONS
  # ─────────────────────────────────────────

  # ─── Aksana — Habit Management (MVP) ───
  # POST /habits — create a habit
  # GET /habits — list all active habits
  # DELETE /habits/{id} — soft delete
  # Stretch: EventBridge + SES daily reminders and weekly summary emails
  HabitsFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: one-more-day-habits
      CodeUri: ../lambdas/habits/
      Handler: handler.lambda_handler
      Runtime: python3.11
      Timeout: 30
      MemorySize: 128
      Environment:
        Variables:
          DYNAMODB_TABLE: !Ref HabitsTable
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Sub "${HabitsTable}"
        - CloudWatchLogsFullAccess
        - SESCrudPolicy:
            IdentityName: !Ref SESEmailIdentity
      Events:
        CreateHabit:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /habits
            Method: POST
        ListHabits:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /habits
            Method: GET
        DeleteHabit:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /habits/{id}
            Method: DELETE

    # Lambda error alarms
  HabitsLambdaErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: one-more-day-habits-errors
      AlarmDescription: Habits Lambda erroring — infrastructure may be degraded
      MetricName: Errors
      Namespace: AWS/Lambda
      Dimensions:
        - Name: FunctionName
          Value: !Ref HabitsFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 3
      # Alarm if 3 or more errors in 5 minutes
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

  # ─── Melody — Daily Check-In (MVP) ───
  # POST /habits/{id}/complete — mark habit done, update streak, publish SNS
  # GET /habits/{id}/history — completion history (if time allows)
  # Unique AWS service: SNS
  CheckinFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: one-more-day-checkin
      CodeUri: ../lambdas/checkin/
      Handler: handler.lambda_handler
      Runtime: python3.11
      Timeout: 30
      MemorySize: 128
      Environment:
        Variables:
          DYNAMODB_TABLE: !Ref HabitsTable
          SNS_TOPIC_ARN: !Ref CheckinTopic
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Sub "${HabitsTable}"
        - CloudWatchLogsFullAccess
        - SNSPublishMessagePolicy:
            TopicName: !GetAtt CheckinTopic.TopicName
      Events:
        CompleteHabit:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /habits/{id}/complete
            Method: POST
        GetHistory:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /habits/{id}/history
            Method: GET

  # Lambda Error Alarm
  CheckinLambdaErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: one-more-day-checkin-errors
      AlarmDescription: CheckinLambda erroring — infrastructure may be degraded
      MetricName: Errors
      Namespace: AWS/Lambda
      Dimensions:
        - Name: FunctionName
          Value: !Ref CheckinFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 3
      # Alarm if 3 or more errors in 5 minutes
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

  # ─── Nilu — Analytics + Dashboard (MVP) ───
  # GET /stats — weekly summary
  # GET /report/export — generate S3 report, return presigned URL
  # Unique AWS service: S3
  # Stretch: Athena pattern queries, Bedrock summaries
  AnalyticsFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: one-more-day-analytics
      CodeUri: ../lambdas/analytics/
      Handler: handler.lambda_handler
      Runtime: python3.11
      Timeout: 30
      MemorySize: 128
      Environment:
        Variables:
          DYNAMODB_TABLE: !Ref HabitsTable
          S3_BUCKET_REPORTS: !Ref ReportsBucket
          S3_BUCKET_LOGS: !Ref LogsBucket
          ATHENA_WORKGROUP: one-more-day-workgroup
          ATHENA_OUTPUT: !Sub "s3://${LogsBucket}/athena-results/"
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Sub "${HabitsTable}"
        - CloudWatchLogsFullAccess
        - S3CrudPolicy:
            BucketName: !Ref ReportsBucket
        - S3CrudPolicy:
            BucketName: !Ref LogsBucket
        - Statement:
            - Effect: Allow
              Action:
                - athena:StartQueryExecution
                - athena:GetQueryExecution
                - athena:GetQueryResults
                - athena:StopQueryExecution
              Resource: "*"
            - Effect: Allow
              Action:
                - glue:GetDatabase
                - glue:GetTable
                - glue:GetPartitions
              Resource: "*"
            - Effect: Allow
              Action:
                - bedrock:InvokeModel
              Resource: "*"
      Events:
        GetStats:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /stats
            Method: GET
        GetStreak:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /habits/{id}/streak
            Method: GET
        ExportReport:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /report/export
            Method: GET

  # Lambda error alarm
  AnalyticsLambdaErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: one-more-day-analytics-errors
      AlarmDescription: Analytics Lambda erroring — infrastructure may be degraded
      MetricName: Errors
      Namespace: AWS/Lambda
      Dimensions:
        - Name: FunctionName
          Value: !Ref AnalyticsFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 3
      # Alarm if 3 or more errors in 5 minutes
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

  # ─── Tami — Health Check (MVP) ───
  # GET /health — confirms all services are connected
  # Unique AWS service: API Gateway + AWS SAM
  HealthFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: one-more-day-health
      CodeUri: ../lambdas/health/
      Handler: handler.lambda_handler
      Runtime: python3.11
      Timeout: 30
      MemorySize: 128
      Environment:
        Variables:
          DYNAMODB_TABLE: !Ref HabitsTable
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Sub "${HabitsTable}"
        - CloudWatchLogsFullAccess
      Events:
        HealthCheck:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /health
            Method: GET

    HealthLambdaErrorAlarm:
      Type: AWS::CloudWatch::Alarm
      Properties:
        AlarmName: one-more-day-health-errors
        AlarmDescription: Health Lambda erroring — infrastructure may be degraded
        MetricName: Errors
        Namespace: AWS/Lambda
        Dimensions:
          - Name: FunctionName
            Value: !Ref HealthFunction
        Statistic: Sum
        Period: 300
        EvaluationPeriods: 1
        Threshold: 3
        # Alarm if 3 or more errors in 5 minutes
        ComparisonOperator: GreaterThanOrEqualToThreshold
        TreatMissingData: notBreaching

  # ─────────────────────────────────────────
  # CLOUDWATCH LOG GROUPS — Tami owns this
  # ─────────────────────────────────────────

  # ─── Log Groups ───
  # One log group per Lambda function
  # Logs are retained for 30 days to keep costs low
  # All four Lambda invocations are logged here automatically

  HabitsLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/one-more-day-habits
      RetentionInDays: 30

  CheckinLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/one-more-day-checkin
      RetentionInDays: 30

  AnalyticsLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/one-more-day-analytics
      RetentionInDays: 30

  HealthLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/one-more-day-health
      RetentionInDays: 30

# ─────────────────────────────────────────
# OUTPUTS — API Gateway URL and ID
# Available after deploy via:
# aws cloudformation describe-stacks --stack-name one-more-day --query "Stacks[0].Outputs"
# ─────────────────────────────────────────
Outputs:
  ApiGatewayUrl:
    Description: API Gateway endpoint URL
    Value: !Sub "https://${ApiGateway}.execute-api.us-east-1.amazonaws.com/prod"

  ApiGatewayId:
    Description: API Gateway ID
    Value: !Ref ApiGateway
